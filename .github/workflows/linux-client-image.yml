name: Linux client image
# Builds docker/linux-client and checks that it holds no SSH server, private keys or game files. On main it is
# published to GHCR as valheim-linux-client (latest and the commit); pull requests only build and check.
# The image contains public software only; no secrets are used beyond the workflow's own package token.
on:
  push:
    branches: [main]
    paths: ['docker/linux-client/**', '.github/workflows/linux-client-image.yml']
  pull_request:
    paths: ['docker/linux-client/**', '.github/workflows/linux-client-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-client-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/valheim-linux-client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: docker build --pull --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$IMAGE:ci" docker/linux-client
      - name: Check contents
        run: |
          docker run --rm "$IMAGE:ci" bash -euo pipefail -c '
            test ! -e /etc/ssh || { echo "SSH server present"; exit 1; }
            if grep -rlsE "BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY" /root /home /etc /opt /usr/local; then echo "private key found"; exit 1; fi
            test -z "$(ls -A /home/steam/valheim)" || { echo "game files present"; exit 1; }
            apt-cache policy | grep repo.steampowered.com/steam > /dev/null || { echo "Steam repository missing from apt policy"; exit 1; }
            for h in vt-start-x vt-qr-url vt-steam vt-screenshot vt-stage-character vt-launch-valheim vt-exec-game vt-stop-game vt-pids vt-stop-all; do command -v "$h" > /dev/null; done
            DepotDownloader 2>&1 | head -1
            echo "contents OK"'
      - name: Helper tests (inert game, no download or login)
        run: docker run --rm --init -v "$PWD/docker/linux-client/tests:/tests:ro" "$IMAGE:ci" bash /tests/helpers.sh
      - name: Publish (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT="${GITHUB_SHA::7}"
          docker tag "$IMAGE:ci" "$IMAGE:$SHORT"; docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker push "$IMAGE:$SHORT"; docker push "$IMAGE:latest"
