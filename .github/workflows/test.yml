name: Private bootstrap fixture identity diagnostic
# TEMPORARY private proposal: replace test.yml only after separate source/runtime grant.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Launch one owned fixture and record setup identity
        id: fixture
        shell: bash
        run: |
          fixture_directory=$(mktemp -d "$RUNNER_TEMP/bootstrap-control.XXXXXXXX")
          printf 'fixture-directory=%s\n' "$fixture_directory" >> "$GITHUB_OUTPUT"
          cat > "$fixture_directory/control.py" <<'CONTROL_PY'
          """Private diagnostic proposal; source only until separately authorized."""
          import datetime,errno,hashlib,json,os,signal,socket,subprocess,sys,time,uuid,xml.etree.ElementTree as ET
          from pathlib import Path
          ACTION_SHA='405250b722d01366d445e94adc0bba2717ebb66a27f29587854377f303e4e5bf'
          CONFIG_SHA='9e7cde96bf71703b2b8e692c2583e2d5fdd132276381199f96b18380c3fdabf7'
          SERVER_SOURCE=r'''import datetime,hashlib,http.server,json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1]);control_id=sys.argv[2]
          def save(name,value):
              p=root/name;t=p.with_name(p.name+'.writing');t.write_text(json.dumps(value)+'\n');os.replace(t,p)
          def identity(pid):
              fields=Path(f'/proc/{pid}/stat').read_text().rsplit(')',1)[1].split()
              return {'pid':pid,'start_ticks':fields[19]}
          save('server.owner.json',dict(identity(os.getpid()),control_id=control_id))
          expected=f'/{control_id}/v3/index.json'
          count=0
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  global count
                  count+=1;status=503 if self.path==expected else 404
                  body=b'Owned #922 audit-source negative control: HTTP 503.\n' if status==503 else b'Unexpected path.\n'
                  if count<=64:
                      record={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'method':'GET','path':expected if self.path==expected else '<unexpected>','status':status,'body_bytes':len(body),'body_sha256':hashlib.sha256(body).hexdigest()}
                      with (root/'requests.jsonl').open('a') as stream:stream.write(json.dumps(record)+'\n')
                  else:(root/'request-overflow.txt').write_text('request record limit exceeded\n')
                  self.send_response(status);self.send_header('Content-Type','text/plain');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
              def log_message(self,*args):pass
          server=http.server.HTTPServer(('127.0.0.1',0),Handler)
          save('server-ready.json',{'pid':os.getpid(),'host':'127.0.0.1','port':server.server_address[1],'control_id':control_id,'expected_path':expected})
          server.serve_forever()
          '''
          def sha(data):return hashlib.sha256(data).hexdigest()
          def save(path,value,limit=None):
              raw=(json.dumps(value,indent=2)+'\n').encode()
              if limit is not None and len(raw)>limit:raise IdentityRefusal('diagnostic-size-limit')
              temporary=path.with_name(path.name+'.writing');temporary.write_bytes(raw);os.replace(temporary,path)
          STAT_LIMIT=4096
          CMDLINE_LIMIT=16384
          ARG_LIMIT=32
          DIAGNOSTIC_LIMIT=32768
          class IdentityRefusal(RuntimeError):
              def __init__(self,code,observation=None):
                  super().__init__(code);self.code=code;self.observation=observation
          def os_result(error):
              if error.errno in [errno.EACCES,errno.EPERM]:return 'permission-denied'
              if error.errno in [errno.ENOSYS,errno.EOPNOTSUPP]:return 'unsupported'
              return 'os-error'
          def bounded_read(path,limit):
              with path.open('rb') as stream:data=stream.read(limit+1)
              if len(data)>limit:raise IdentityRefusal('proc-input-oversized')
              return data
          def parse_stat(raw):
              if not isinstance(raw,bytes) or len(raw)>STAT_LIMIT:raise IdentityRefusal('stat-input-invalid')
              try:
                  fields=raw.decode().rsplit(')',1)[1].split()
                  state=fields[0];ticks=fields[19]
                  if len(state)!=1 or len(ticks)>20 or not ticks.isascii() or not ticks.isdigit():raise ValueError()
                  return {'state':state,'start_ticks':ticks}
              except (ValueError,IndexError,UnicodeError):raise IdentityRefusal('stat-parse-failed') from None
          def parse_proc_bytes(pid,first,cmdline,current):
              # This is the actual proc_identity parser, also called by pure byte tests.
              # Preserve proposal02's filtering of ALL empty split fields for this diagnostic.
              # Raw empty positions remain visible as metadata, not as an ownership correction.
              if not isinstance(cmdline,bytes) or len(cmdline)>CMDLINE_LIMIT:raise IdentityRefusal('cmdline-input-oversized')
              parts=cmdline.split(b'\0')
              if len(parts)>ARG_LIMIT:raise IdentityRefusal('cmdline-argument-limit')
              observation={'pid':pid,'_cmdline':cmdline,'_raw_parts':parts,'_parsed_parts':[part for part in parts if part]}
              try:
                  before=parse_stat(first);after=parse_stat(current);observation.update(after)
                  if before['start_ticks']!=after['start_ticks']:raise IdentityRefusal('start-changed-during-read')
                  observation['argv']=[part.decode() for part in observation['_parsed_parts']]
                  return observation
              except IdentityRefusal as error:
                  error.observation=observation;raise
              except UnicodeError:raise IdentityRefusal('cmdline-decode-failed',observation) from None
          def proc_identity(pid):
              try:
                  first=bounded_read(Path(f'/proc/{pid}/stat'),STAT_LIMIT)
                  cmdline=bounded_read(Path(f'/proc/{pid}/cmdline'),CMDLINE_LIMIT)
                  current=bounded_read(Path(f'/proc/{pid}/stat'),STAT_LIMIT)
              except FileNotFoundError:return None
              return parse_proc_bytes(pid,first,cmdline,current)
          def expected_argv(root,owner):return [str(root/'server.py'),str(root),owner['control_id']]
          def identity_metadata(root,owner,identity):
              expected=expected_argv(root,owner)
              launch=[owner.get('expected_interpreter',sys.executable),*expected]
              if any(not isinstance(value,str) or len(value.encode())>4096 for value in launch):raise IdentityRefusal('expected-input-oversized')
              summary={'owned_pid':owner['pid'],'owner_start_ticks':owner['start_ticks'],'expected_launch_argv':launch,'absent':identity is None}
              if identity is None:return summary
              summary.update({'observed_start_ticks':identity.get('start_ticks'),'kernel_state':identity.get('state')})
              raw=identity.get('_cmdline')
              if raw is None:return dict(summary,raw_available=False)
              parts=identity['_raw_parts'];parsed=identity['_parsed_parts']
              summary.update({'raw_available':True,'raw_byte_length':len(raw),'raw_sha256':sha(raw),'nul_count':raw.count(b'\0'),'trailing_nul':raw.endswith(b'\0'),'raw_split_count':len(parts),'raw_empty_positions':[i for i,part in enumerate(parts) if not part],'parsed_argument_count':len(parsed)})
              summary['raw_positions']=[{'position':index,'byte_length':len(part),'sha256':sha(part),'equals_expected_position':index<len(launch) and part==launch[index].encode()} for index,part in enumerate(parts)]
              positions=[]
              for index,part in enumerate(parsed):
                  value={'position':index,'byte_length':len(part),'sha256':sha(part),'equals_expected':index<len(launch) and part==launch[index].encode()}
                  if 1<=index<=3:
                      known=expected[index-1];value['equals_expected']=part==known.encode()
                      if index in [1,2]:
                          try:
                              decoded=part.decode();normalized=os.path.normpath(decoded)
                              value['normalized_equals_expected']=normalized==os.path.normpath(known)
                              value['within_owned_root']=os.path.commonpath([str(root),normalized])==str(root)
                          except (UnicodeError,ValueError):
                              value.update(normalized_equals_expected=False,within_owned_root=False)
                  positions.append(value)
              summary['positions']=positions
              return summary
          class IdentityDiagnostics:
              def __init__(self,root):
                  self.root=root;self.path=root/'identity-diagnostics.json'
                  self.value={'schema':1,'initial':None,'first_failure':None,'operations':[]}
                  if self.path.exists():
                      self.value=json.loads(bounded_read(self.path,DIAGNOSTIC_LIMIT))
                      if self.value.get('schema')!=1 or len(self.value.get('operations',[]))>32:raise IdentityRefusal('diagnostic-state-invalid')
              def persist(self,kind,row):
                  save(self.path,self.value,limit=DIAGNOSTIC_LIMIT)
                  # Only bounded controller-created fields, fixed enums, hashes and booleans.
                  print('CONTROL_IDENTITY '+json.dumps({'kind':kind,'record':row}),flush=True)
              def identity(self,stage,owner,identity,failed=False,code=None):
                  key='first_failure' if failed else 'initial'
                  if self.value[key] is not None:return
                  row=dict(identity_metadata(self.root,owner,identity),stage=stage,result_class=code or 'observed')
                  if failed and identity is None:row.update(absent=None,observation_unavailable=True)
                  self.value[key]=row;self.persist(key,row)
              def operation(self,stage,result_class,error=None):
                  if len(self.value['operations'])>=32:raise IdentityRefusal('diagnostic-operation-limit')
                  row={'stage':stage,'result_class':result_class}
                  if isinstance(error,OSError):row['errno']=error.errno
                  self.value['operations'].append(row);self.persist('operation',row)
          def observe_owned_server(root,owner,diagnostics=None,stage='observation'):
              identity=None
              try:
                  identity=proc_identity(owner['pid'])
                  if stage=='setup-popen' and diagnostics:diagnostics.identity(stage,owner,identity)
                  if identity is None:return 'absent'
                  if identity['start_ticks']!=owner['start_ticks']:raise IdentityRefusal('owner-start-mismatch')
                  if identity['state'] in ['Z','X']:return 'exited-not-reaped'
                  if identity['argv'][1:]!=expected_argv(root,owner):raise IdentityRefusal('argv-mismatch')
                  return 'live'
              except BaseException as error:
                  if diagnostics:diagnostics.identity(stage,owner,getattr(error,'observation',None) or identity,failed=True,code=error.code if isinstance(error,IdentityRefusal) else 'proc-read-failed')
                  raise
          def stop_cross_step_server(root,owner,diagnostics=None):
              pid=owner['pid'];assert isinstance(pid,int) and pid>1
              forced=False;fd=None;events=[]
              def observe(stage):
                  value=observe_owned_server(root,owner,diagnostics,stage);events.append(value);return value
              def record(stage,value,error=None):
                  if diagnostics:diagnostics.operation(stage,value,error)
              def wait_absent(seconds,stage):
                  deadline=time.monotonic()+seconds
                  while True:
                      state=observe(stage)
                      if state=='absent':return True
                      remaining=deadline-time.monotonic()
                      if remaining<=0:return False
                      time.sleep(min(.05,remaining))
              def send_owned(sig,stage):
                  # Check live argv immediately before using the already identity-bound handle.
                  state=observe(stage+'-identity')
                  if state!='live':return state
                  record(stage,'attempt')
                  try:signal.pidfd_send_signal(fd,sig,None,0)
                  except ProcessLookupError as error:
                      record(stage,'esrch',error);state=observe(stage+'-esrch-recheck')
                      if state=='live':raise RuntimeError('ESRCH conflicts with a matching live process; cleanup ambiguous')
                      return state
                  except OSError as error:record(stage,os_result(error),error);raise
                  except BaseException:record(stage,'non-os-error');raise
                  record(stage,'delivered');return 'delivered'
              try:
                  state=observe('cleanup-initial')
                  if state=='absent':gone=True
                  elif state=='exited-not-reaped':gone=wait_absent(5,'initial-zombie-wait')
                  else:
                      if not callable(getattr(os,'pidfd_open',None)) or not callable(getattr(signal,'pidfd_send_signal',None)):
                          record('pidfd-capability','unavailable')
                          raise RuntimeError('Linux pidfd support required; no numeric-PID fallback')
                      record('pidfd-capability','available');record('pidfd-open','attempt')
                      try:fd=os.pidfd_open(pid,0)
                      except ProcessLookupError as error:
                          record('pidfd-open','esrch',error);state=observe('pidfd-open-esrch-recheck')
                          if state=='live':raise RuntimeError('pidfd ESRCH conflicts with a matching live process')
                          gone=state=='absent' or wait_absent(5,'pidfd-open-esrch-wait')
                      except OSError as error:record('pidfd-open',os_result(error),error);raise
                      except BaseException:record('pidfd-open','non-os-error');raise
                      else:
                          record('pidfd-open','opened')
                          # Replacement after pidfd_open fails identity checks; replacement
                          # after this check cannot receive a signal bound to the original fd.
                          state=send_owned(signal.SIGTERM,'pidfd-term')
                          gone=state=='absent' or wait_absent(5,'term-wait')
                          if not gone:
                              state=observe('before-kill')
                              if state=='live':
                                  state=send_owned(signal.SIGKILL,'pidfd-kill')
                                  forced=state=='delivered'
                                  gone=state=='absent' or wait_absent(5,'kill-wait')
                              # A same-start zombie is never signaled or called absent.
                  return {'accepted':gone and not forced,'pid':pid,'start_ticks':owner['start_ticks'],'process_absent':gone,'forced_kill':forced,'observations':events[-64:]}
              finally:
                  if fd is not None:
                      try:os.close(fd)
                      except OSError as error:record('pidfd-close',os_result(error),error);raise
                      else:record('pidfd-close','closed')
          def package_snapshot(workspace):
              return {str(path.relative_to(workspace)):sha(path.read_bytes()) for path in sorted((workspace/'.packages').rglob('*')) if path.is_file()}
          def setup(root,workspace,fixture_only=False):
              assert sha((workspace/'.github/actions/setup/action.yml').read_bytes())==ACTION_SHA
              if not fixture_only:
                  original=(workspace/'NuGet.Config').read_bytes();assert sha(original)==CONFIG_SHA
                  (root/'original-NuGet.Config').write_bytes(original)
              control_id='hosted-'+uuid.uuid4().hex
              state={'control_id':control_id,'fixture_only':fixture_only,'expected_interpreter':sys.executable,'action_sha256':ACTION_SHA,
                     'commit':subprocess.check_output(['git','rev-parse','HEAD'],cwd=workspace,timeout=30,text=True).strip(),
                     'package_snapshot':package_snapshot(workspace),
                     'source_hashes':{name:sha((workspace/name).read_bytes()) for name in ['scripts/bootstrap-cli.cs','scripts/Directory.Build.props','Directory.Build.props','cli-dependency.json','loader-dependency.json','NuGet.Config']}}
              if not fixture_only:state['original_config_sha256']=sha(original)
              save(root/'state.json',state)
              (root/'server.py').write_text(SERVER_SOURCE)
              stdout=(root/'server.stdout.log').open('wb');stderr=(root/'server.stderr.log').open('wb')
              proc=None
              try:
                  proc=subprocess.Popen([sys.executable,str(root/'server.py'),str(root),control_id],stdout=stdout,stderr=stderr,start_new_session=True)
                  deadline=time.monotonic()+10
                  while not (root/'server-ready.json').exists():
                      assert proc.poll() is None,'owned fixture exited before readiness'
                      assert time.monotonic()<deadline,'owned fixture readiness timeout'
                      time.sleep(.02)
                  ready=json.loads((root/'server-ready.json').read_text());owner=json.loads((root/'server.owner.json').read_text())
                  owner['expected_interpreter']=state['expected_interpreter']
                  assert ready['pid']==owner['pid']==proc.pid and ready['host']=='127.0.0.1' and ready['control_id']==control_id
                  diagnostics=IdentityDiagnostics(root)
                  assert observe_owned_server(root,owner,diagnostics,'setup-popen')=='live','setup identity did not establish a live fixture'
                  endpoint=f'http://127.0.0.1:{ready["port"]}/{control_id}/v3/index.json'
                  if fixture_only:
                      print('CONTROL_SETUP '+json.dumps({'fixture_only':True,'fixture_directory':str(root),'pid':proc.pid,'action_sha256':ACTION_SHA,'commit':state['commit']}),flush=True)
                      return
                  tree=ET.fromstring(original);assert tree.find('auditSources') is None
                  audit=ET.SubElement(tree,'auditSources');ET.SubElement(audit,'clear')
                  ET.SubElement(audit,'add',{'key':'controlled-audit-failure','value':endpoint,'protocolVersion':'3','allowInsecureConnections':'true'})
                  assert ET.tostring(ET.fromstring(original).find('packageSources'))==ET.tostring(tree.find('packageSources'))
                  changed=ET.tostring(tree,encoding='utf-8',xml_declaration=True)
                  state.update({'endpoint':endpoint,'controlled_config_sha256':sha(changed),'package_sources_unchanged':True})
                  save(root/'state.json',state)
                  (workspace/'NuGet.Config').write_bytes(changed)
                  print('CONTROL_SETUP '+json.dumps({'fixture_directory':str(root),'pid':proc.pid,'endpoint':endpoint,'action_sha256':ACTION_SHA,'commit':state['commit'],'original_config_sha256':sha(original),'controlled_config_sha256':sha(changed)}),flush=True)
              except BaseException:
                  # The shared cleanup runs even if state/report writing failed after spawn.
                  # The local Popen handle closes the tiny owner-file creation race on setup failure.
                  try:cleanup(root,workspace,local_proc=proc,fixture_only=fixture_only)
                  finally:raise
              finally:
                  for stream in [stdout,stderr]:
                      try:stream.close()
                      except BaseException:pass
          
          def cleanup(root,workspace,local_proc=None,fixture_only=False):
              errors=[];records={}
              def attempt(name,operation):
                  try:
                      value=operation();records[name]=value
                      if not value.get('accepted'):errors.append(name+' not verified')
                  except BaseException as error:
                      records[name]={'accepted':False,'result_class':error.code if isinstance(error,IdentityRefusal) else 'operation-failed','type':type(error).__name__};errors.append(name+' failed')
              def restore_config():
                  backup=root/'original-NuGet.Config'
                  if not backup.exists():
                      # Setup writes this before any server/config change; no backup means
                      # no config mutation by the ordered controller. Still attempt server cleanup.
                      assert sha((workspace/'NuGet.Config').read_bytes())==CONFIG_SHA
                      return {'accepted':True,'backup_absent_original_config_unchanged':True}
                  original=backup.read_bytes();assert sha(original)==CONFIG_SHA
                  (workspace/'NuGet.Config').write_bytes(original)
                  return {'accepted':(workspace/'NuGet.Config').read_bytes()==original,'restored_sha256':sha((workspace/'NuGet.Config').read_bytes())}
              def stop_server():
                  if local_proc is not None:
                      forced=False;termination_error=None
                      try:
                          if local_proc.poll() is None:local_proc.terminate()
                      except BaseException as error:termination_error=type(error).__name__
                      finally:
                          try:local_proc.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              forced=True
                              try:local_proc.kill()
                              finally:local_proc.wait(timeout=5)
                      return {'accepted':local_proc.poll() is not None and not forced and termination_error is None,'pid':local_proc.pid,'local_child_reaped':True,'exit':local_proc.returncode,'forced_kill':forced,'termination_error':termination_error}
                  owner_path=root/'server.owner.json'
                  if not owner_path.exists():return {'accepted':True,'owner_absent_no_spawn_state':True}
                  owner=json.loads(owner_path.read_text())
                  owner['expected_interpreter']=json.loads(bounded_read(root/'state.json',DIAGNOSTIC_LIMIT))['expected_interpreter']
                  return stop_cross_step_server(root,owner,IdentityDiagnostics(root))
              def check_listener():
                  ready_path=root/'server-ready.json'
                  if not ready_path.exists():return {'accepted':False,'ready_state_absent':True}
                  ready=json.loads(ready_path.read_text());assert ready['host']=='127.0.0.1' and 0<ready['port']<65536
                  with socket.socket() as probe:probe.settimeout(.5);code=probe.connect_ex(('127.0.0.1',ready['port']))
                  return {'accepted':code==errno.ECONNREFUSED,'port':ready['port'],'errno':code,'errno_name':errno.errorcode.get(code)}
              def source_and_packages():
                  state=json.loads((root/'state.json').read_text())
                  source_ok=all(sha((workspace/name).read_bytes())==digest for name,digest in state['source_hashes'].items())
                  packages_ok=package_snapshot(workspace)==state['package_snapshot']
                  action_ok=sha((workspace/'.github/actions/setup/action.yml').read_bytes())==ACTION_SHA
                  return {'accepted':source_ok and packages_ok and action_ok,'source_unchanged':source_ok,'package_snapshot_unchanged':packages_ok,'action_unchanged':action_ok,'commit':state['commit']}
              def provenance():
                  state=json.loads((root/'state.json').read_text())
                  requests_path=root/'requests.jsonl';raw=requests_path.read_bytes() if requests_path.exists() else b''
                  assert len(raw)<=65536 and not (root/'request-overflow.txt').exists(),'fixture request evidence overflow'
                  requests=[json.loads(line) for line in raw.splitlines()]
                  expected='/' + state['control_id'] + '/v3/index.json'
                  valid=bool(requests) and len(requests)<=64 and all(row['method']=='GET' and row['path']==expected and row['status']==503 for row in requests)
                  # Only controller-owned fields and bounded fixed request records reach logs.
                  print('CONTROL_PROVENANCE '+json.dumps({'state':state,'requests':requests}),flush=True)
                  return {'accepted':valid,'request_count':len(requests),'all_exact_get_503':valid,'request_file_sha256':sha(raw)}
              def capture_provenance():
                  pointer=os.environ.get('CONTROL_EVIDENCE_DIRECTORY','')
                  assert pointer,'composite evidence output absent'
                  evidence=Path(pointer).resolve();runner_temp=Path(os.environ['RUNNER_TEMP']).resolve()
                  assert evidence.parent==runner_temp and evidence.name.startswith('bootstrap-evidence.'),'unexpected capture directory'
                  raw=(evidence/'metadata.txt').read_bytes();assert len(raw)<=16384
                  metadata={}
                  allowed={'phase','command','started-utc','commit','commit-status','run-id','run-attempt','job-id','runner-os','runner-arch','evidence-label','sdk-version','sdk-version-status','completed-utc','elapsed-seconds','dotnet-status','tee-status'}
                  for line in raw.decode().splitlines():
                      key,separator,value=line.partition('=');assert separator and key in allowed and key not in metadata
                      metadata[key]=value
                  assert set(metadata)==allowed
                  state=json.loads((root/'state.json').read_text())
                  assert metadata['command']=='dotnet run scripts/bootstrap-cli.cs' and metadata['commit']==state['commit']
                  assert metadata['dotnet-status'].isdigit() and int(metadata['dotnet-status'])>0 and metadata['tee-status']=='0'
                  assert metadata['evidence-label']=='control-nu1900-linux'
                  summary={'directory':str(evidence),'metadata_sha256':sha(raw),'bootstrap_log_sha256':sha((evidence/'bootstrap.log').read_bytes()),'metadata':metadata}
                  print('CONTROL_CAPTURE '+json.dumps(summary),flush=True)
                  return {'accepted':True,'metadata_sha256':summary['metadata_sha256'],'bootstrap_log_sha256':summary['bootstrap_log_sha256']}
              if not fixture_only:attempt('config',restore_config)
              attempt('server',stop_server)
              attempt('listener',check_listener)
              attempt('source-and-packages',source_and_packages)
              if not fixture_only:
                  attempt('provenance',provenance)
                  attempt('capture-provenance',capture_provenance)
                  if os.environ.get('BOOTSTRAP_OUTCOME')!='failure':errors.append('caller action outcome was not failure')
              outcome={'accepted':not errors,'operations':records,'errors':errors}
              # Reporting is after all resource attempts. Its failure cannot skip cleanup.
              try:save(root/'cleanup.json',outcome)
              except BaseException as error:outcome['accepted']=False;outcome['errors'].append('cleanup report failed: '+type(error).__name__)
              try:print('CONTROL_CLEANUP '+json.dumps(outcome),flush=True)
              except BaseException:outcome['accepted']=False
              return outcome['accepted']
          
          if __name__=='__main__':
              root=Path(__file__).resolve().parent;workspace=Path(os.environ['GITHUB_WORKSPACE']).resolve();runner_temp=Path(os.environ['RUNNER_TEMP']).resolve()
              assert root.parent==runner_temp and root.name.startswith('bootstrap-control.'),'refuse unexpected fixture path'
              mode=sys.argv[1];assert mode in ['setup','cleanup','fixture-setup','fixture-cleanup']
              if mode in ['setup','fixture-setup']:setup(root,workspace,fixture_only=mode=='fixture-setup')
              else:raise SystemExit(0 if cleanup(root,workspace,fixture_only=mode=='fixture-cleanup') else 1)
          CONTROL_PY
          python3 "$fixture_directory/control.py" fixture-setup
      - name: Independently guard cleanup and verify listener closure
        if: always()
        shell: bash
        env:
          FIXTURE_DIRECTORY: ${{ steps.fixture.outputs.fixture-directory }}
        run: |
          if [[ -z "$FIXTURE_DIRECTORY" ]]; then
            echo '::error::Fixture allocation/output absent; diagnostic not established.'
            exit 1
          fi
          case "$FIXTURE_DIRECTORY" in
            "$RUNNER_TEMP"/bootstrap-control.*) ;;
            *) echo '::error::Refuse an unexpected fixture path.'; exit 1 ;;
          esac
          if [[ ! -f "$FIXTURE_DIRECTORY/control.py" ]]; then
            echo '::error::Controller not fully prepared; diagnostic not established.'
            exit 1
          fi
          python3 "$FIXTURE_DIRECTORY/control.py" fixture-cleanup
