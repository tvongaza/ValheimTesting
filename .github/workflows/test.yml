name: Local test layers
# Bootstrap and local validation on every supported toolkit OS: library tests, example builds, the two
# no-game examples, package-consuming mod tests and packing. Never launches Valheim or a server. The scripts are .NET file-based
# programs, so the same commands run in each runner's default shell. No secrets are used. The mod-example job runs
# the ModWithTests workflow template's commands against the published packages. The game-hosts job drives the real ssh
# and docker paths of the game hosts against a throwaway sshd on localhost and a throwaway container.
# Pushes to main and pull requests only: a branch with an open PR would otherwise run everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # One OS failing must not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # GitHub's Windows runners run the job in the signed-in console session, so the interactive client's scheduled-task
      # start is required to run there (with stand-ins for Steam and the game) rather than only its refusal.
      VALHEIM_TESTING_WINDOWS_DESKTOP: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      # The NuGet package cache's paths (see "Restore the NuGet package cache"), shared by its restore and save.
      VT_NUGET_CACHE_PATHS: |
        ~/.nuget/packages
        !~/.nuget/packages/valheim.testing*
        !~/.nuget/packages/valheim.cli*
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Runner images carry a .NET SDK, but not necessarily 10; pin the channel on every OS.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Real-time malware scanning of every file restore and build write made Windows the slowest leg (its package restores
      # took 55 s against 11-14 s on Linux and macOS). The runner is discarded after the job. A warning, not a failure, if
      # an image ever refuses the change.
      - name: Stop real-time scanning on this throwaway Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try
          {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            "Real-time monitoring disabled: $((Get-MpPreference -ErrorAction Stop).DisableRealtimeMonitoring)"
          }
          catch { Write-Output "::warning::Real-time scanning stays on: $($_.Exception.Message)" }
      # Packages from NuGet.org, reused across runs. Never this repository's own packages (Valheim.Testing*, and the CLI
      # transport bootstrap builds): validate packs those at versions it reuses and checks that consumers restore exactly what
      # it packed, which a cached copy of an earlier build would defeat. A restored entry is trusted as NuGet's global
      # packages folder trusts its own files; only this repository's workflows can write the cache, a pull request only for itself.
      - name: Restore the NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VT_NUGET_CACHE_PATHS }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'scripts/*.cs', 'cli-dependency.json', 'NuGet.Config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet --info
      - run: dotnet run scripts/bootstrap-cli.cs
      # validate.cs stops a command at its own 10-minute deadline, with a process table; the step timeout is the backstop if
      # the script itself stops answering. Normal runs take 2-5 minutes. Its transcript and test results are kept when the
      # step fails or is cancelled (#171).
      - run: dotnet run scripts/validate.cs
        timeout-minutes: 20
      - name: Keep the validation transcript
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: validate-${{ matrix.os }}
          path: artifacts/validate
          if-no-files-found: ignore
          retention-days: 14
      - name: Build targeted regression from NuGet.org only
        run: dotnet run scripts/targeted-consumer.cs
      - name: Build candidate API reference
        if: runner.os == 'Linux'
        run: |
          dotnet tool restore
          dotnet run scripts/api-docs.cs
      - name: Save the NuGet package cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VT_NUGET_CACHE_PATHS }}
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
  mod-example:
    name: mod example (published packages)
    # Keep in step with examples/ModWithTests/.github/workflows/tests.yml. A copy outside the checkout leaves this
    # repository's NuGet.Config and local feed out of play, so packages restore from NuGet.org only, as in a mod.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: cp -R examples/ModWithTests "$RUNNER_TEMP/mod"
      - run: dotnet test MyMod.Tests/MyMod.Tests.csproj -c Release
        working-directory: ${{ runner.temp }}/mod
  doc-pins:
    name: doc pins (published versions)
    # Every copyable pin must resolve on NuGet.org. Examples keep their tested exact versions until intentionally upgraded;
    # a new package release alone does not invalidate them. This reads NuGet.org and needs no build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run scripts/release-consumer.cs -- pins
      # Candidates may sit on main between releases; release.yml refuses them. This only proves the refusal works.
      - name: A candidate version is refused at release (negative control)
        run: |
          refused() { # $1 file, $2 sed expression
            git checkout -- cli-dependency.json src/Valheim.Testing.Game/Valheim.Testing.Game.csproj
            sed -i -E "$2" "$1"
            if out=$(dotnet run scripts/release-consumer.cs -- versions 2>&1); then
              echo "$out"; echo "::error::release-consumer versions accepted a candidate in $1."; return 1
            fi
            echo "$out"
            case "$out" in *"$1:"*"-candidate.0000000"*) ;; *) echo "::error::The refusal does not name $1."; return 1 ;; esac
          }
          refused cli-dependency.json 's/("packageVersion": "[^"]+)"/\1-candidate.0000000"/'
          refused src/Valheim.Testing.Game/Valheim.Testing.Game.csproj 's/(Include="Valheim\.Testing\.Cli" Version="\[[^]]+)\]/\1-candidate.0000000]/'
          git checkout -- cli-dependency.json src/Valheim.Testing.Game/Valheim.Testing.Game.csproj
  game-hosts:
    name: game hosts (ssh to localhost, container)
    # Valheim.Testing.Game's SSH and container hosts end to end, without a game: an sshd on 127.0.0.1:2222 that accepts only
    # a key generated for this run (bash and pwsh sessions, a loopback port forward), and an Ubuntu container on the host
    # network driven with docker exec. Both are removed at the end; the keys live in the runner's temporary directory. An Xvfb
    # display on :99 carries the interactive client checks (a stand-in Steam and game), locally and over the ssh. The lease
    # contention checks open ten ssh sessions at once, beyond sshd's default MaxStartups of 10 unauthenticated connections.
    # The client key and known_hosts sit in a directory with a space in its name, so every connection passes quoted ssh options.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      VALHEIM_TESTING_REQUIRE_HOSTS: '1'
      VALHEIM_TESTING_SSH_PORT: '2222'
      VALHEIM_TESTING_SSH_SHELLS: bash,pwsh
      VALHEIM_TESTING_CONTAINER: vt-game-host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run scripts/bootstrap-cli.cs
      - name: Start a throwaway sshd on 127.0.0.1:2222
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/sshd"
          mkdir -p "$d"
          if [ ! -x /usr/sbin/sshd ]; then sudo apt-get update -q && sudo apt-get install -y -q openssh-server; fi
          ssh-keygen -q -t ed25519 -N '' -C vt-host -f "$d/host_key"
          k="$RUNNER_TEMP/vt client key"
          mkdir -p "$k"
          ssh-keygen -q -t ed25519 -N '' -C vt-client -f "$k/client_key"
          cp "$k/client_key.pub" "$d/authorized_keys"
          printf '%s\n' "Port 2222" "ListenAddress 127.0.0.1" "HostKey $d/host_key" "PidFile $d/sshd.pid" \
            "AuthorizedKeysFile $d/authorized_keys" "PasswordAuthentication no" "KbdInteractiveAuthentication no" \
            "PubkeyAuthentication yes" "UsePAM yes" "StrictModes no" "AllowTcpForwarding local" "AllowAgentForwarding no" \
            "X11Forwarding no" "MaxStartups 100" "Subsystem sftp internal-sftp" > "$d/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$d/sshd_config" -E "$d/sshd.log"
          echo "[127.0.0.1]:2222 $(cut -d' ' -f1,2 "$d/host_key.pub")" > "$k/known_hosts"
          echo "VALHEIM_TESTING_SSH_DESTINATION=$(id -un)@127.0.0.1" >> "$GITHUB_ENV"
          {
            echo "VALHEIM_TESTING_SSH_OPTIONS<<VT_OPTIONS"
            echo "IdentityFile=$k/client_key"
            echo "IdentitiesOnly=yes"
            echo "UserKnownHostsFile=$k/known_hosts"
            echo "StrictHostKeyChecking=yes"
            echo "VT_OPTIONS"
          } >> "$GITHUB_ENV"
          # ssh reads a -o value like a config line, so a path with a space is quoted inside the argument.
          ssh -o BatchMode=yes -o "IdentityFile=\"$k/client_key\"" -o IdentitiesOnly=yes -o "UserKnownHostsFile=\"$k/known_hosts\"" \
            -o StrictHostKeyChecking=yes -p 2222 "$(id -un)@127.0.0.1" 'echo "ssh to localhost works; pwsh: $(command -v pwsh)"'
      - name: Start a throwaway container on the host network
        run: docker run -d --rm --name vt-game-host --network host ubuntu:24.04 sleep 1800
      - name: Start a virtual X display for the interactive client checks
        run: |
          set -euo pipefail
          if ! command -v Xvfb > /dev/null; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi
          Xvfb :99 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"
          for _ in $(seq 1 100); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          echo "VALHEIM_TESTING_DISPLAY=:99" >> "$GITHUB_ENV"
      - run: dotnet test tests/Valheim.Testing.Tests/Valheim.Testing.Tests.csproj -c Release --filter Category=GameHosts
      - name: Stop the sshd and the container
        if: always()
        run: |
          docker rm -f vt-game-host || true
          if [ -f "$RUNNER_TEMP/xvfb.pid" ]; then kill "$(cat "$RUNNER_TEMP/xvfb.pid")" || true; fi
          if [ -f "$RUNNER_TEMP/sshd/sshd.pid" ]; then sudo kill "$(cat "$RUNNER_TEMP/sshd/sshd.pid")" || true; fi
          cat "$RUNNER_TEMP/sshd/sshd.log" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/sshd" "$RUNNER_TEMP/vt client key"
  test-runners:
    name: test runners (${{ matrix.os }})
    # tools/test-runners for real: a copy of ModWithTests that also targets net48 (the two changes its README
    # describes), run with Mono on Linux and macOS and on .NET Framework on Windows. Negative control: an added
    # test that fails only on .NET Framework must make the script exit 1, while the net10.0 leg alone still passes, and
    # a filter that selects no test must fail the net48 leg.
    # Packages restore from NuGet.org, as in a mod.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Real-time malware scanning of every file restore and build write made Windows the slowest leg (its package restores
      # took 55 s against 11-14 s on Linux and macOS). The runner is discarded after the job. A warning, not a failure, if
      # an image ever refuses the change.
      - name: Stop real-time scanning on this throwaway Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try
          {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            "Real-time monitoring disabled: $((Get-MpPreference -ErrorAction Stop).DisableRealtimeMonitoring)"
          }
          catch { Write-Output "::warning::Real-time scanning stays on: $($_.Exception.Message)" }
      # Hosted Linux and macOS images carry no Mono. On Ubuntu, mono-devel is the smallest package set that runs the net48
      # leg: mono-runtime alone lacks the System.Runtime and netstandard facades the console runner loads. Its archives
      # are cached because the mirror's speed, not their size, decides the install time: the same 52 MB took 6 s or
      # several minutes on different runners.
      - name: Key the Mono packages
        if: runner.os == 'Linux'
        id: mono-debs
        run: |
          sudo apt-get update -q
          # Name, size and checksum of each archive apt would fetch: a new package version is a new key, never a stale hit.
          apt-get install --print-uris -qq -y --no-install-recommends mono-devel > "$RUNNER_TEMP/mono-uris.txt"
          echo "key=mono-debs-$ImageOS-${{ runner.arch }}-$(sha256sum < "$RUNNER_TEMP/mono-uris.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the Mono packages
        if: runner.os == 'Linux'
        id: mono-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mono-debs
          key: ${{ steps.mono-debs.outputs.key }}
      - name: Install Mono
        if: runner.os == 'Linux'
        run: |
          # apt installs a same-size archive from its cache without checking it, and --print-uris gives only MD5 sums,
          # so a restored archive is used only when its SHA256 is the one the signed index gives; apt downloads the rest.
          # <package>=<version> (an epoch's colon is %3a in a file name) and the file name of each archive:
          archives() { while read -r _ file _; do v=${file#*_}; id="${file%%_*}=${v%_*}"; printf '%s %s\n' "${id//%3a/:}" "$file"; done < "$RUNNER_TEMP/mono-uris.txt"; }
          if [ -d "$RUNNER_TEMP/mono-debs" ]; then
            apt-cache show $(archives | cut -d' ' -f1) | awk '/^Package:/ { p = $2 } /^Version:/ { v = $2 } /^SHA256:/ { print p "=" v, $2 }' > "$RUNNER_TEMP/mono-sha256.txt"
            while read -r id file; do
              f="$RUNNER_TEMP/mono-debs/$file"; [ -f "$f" ] || continue
              want=$(awk -v id="$id" '$1 == id { print $2; exit }' "$RUNNER_TEMP/mono-sha256.txt")
              if [ -n "$want" ] && [ "$(sha256sum < "$f" | cut -d' ' -f1)" = "$want" ]; then sudo cp "$f" /var/cache/apt/archives/
              else echo "Not using the cached $file: it is not the archive the index names."; fi
            done < <(archives)
          fi
          sudo apt-get install -y -q --no-install-recommends mono-devel
          mono --version
          mkdir -p "$RUNNER_TEMP/mono-debs"; cp /var/cache/apt/archives/*.deb "$RUNNER_TEMP/mono-debs/"
      - name: Save the Mono packages
        if: runner.os == 'Linux' && steps.mono-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mono-debs
          key: ${{ steps.mono-debs.outputs.key }}
      - name: Install Mono
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install mono
          mono --version
      - name: Copy ModWithTests and target net48 too
        shell: bash
        run: |
          cp -R examples/ModWithTests "$RUNNER_TEMP/mod"
          project="$RUNNER_TEMP/mod/MyMod.Tests/MyMod.Tests.csproj"
          sed -i.orig \
            -e 's#<TargetFramework>net10.0</TargetFramework>#<TargetFrameworks>net48;net10.0</TargetFrameworks>#' \
            -e 's#<PackageReference Include="xunit" Version="2.8.1" />#&<PackageReference Include="xunit.runner.console" Version="2.8.1" PrivateAssets="all" />#' \
            "$project"
          grep -q '<TargetFrameworks>net48;net10.0</TargetFrameworks>' "$project"
          grep -q 'Include="xunit.runner.console"' "$project"
          rm "$project.orig"
      - name: Both frameworks pass (bash)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/mod
        run: bash "$GITHUB_WORKSPACE/tools/test-runners/run-tests.sh" MyMod.Tests/MyMod.Tests.csproj
      - name: Both frameworks pass (Windows PowerShell)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/mod
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\tools\test-runners\run-tests.ps1" MyMod.Tests\MyMod.Tests.csproj
      - name: Add a test that fails only on .NET Framework
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mod/MyMod.Tests/Net48OnlyFailure.cs" <<'CS'
          using Xunit;

          public class Net48OnlyFailure
          {
              [Fact]
              public void FailsOnlyOnNetFramework()
              {
          #if NETFRAMEWORK
                  Assert.Fail("negative control: this test fails only on .NET Framework");
          #endif
              }
          }
          CS
      - name: Negative control (bash)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/mod
        run: |
          status=0
          bash "$GITHUB_WORKSPACE/tools/test-runners/run-tests.sh" MyMod.Tests/MyMod.Tests.csproj || status=$?
          if [ "$status" != 1 ]; then echo "::error::a net48-only failure must make run-tests.sh exit 1; it exited $status"; exit 1; fi
          bash "$GITHUB_WORKSPACE/tools/test-runners/run-tests.sh" --framework net10.0 MyMod.Tests/MyMod.Tests.csproj
          # A filter that selects no test must not pass the net48 leg.
          status=0
          bash "$GITHUB_WORKSPACE/tools/test-runners/run-tests.sh" --framework net48 --filter FullyQualifiedName~NoSuchTest MyMod.Tests/MyMod.Tests.csproj || status=$?
          if [ "$status" != 1 ]; then echo "::error::a net48 leg that ran no tests must make run-tests.sh exit 1; it exited $status"; exit 1; fi
      - name: Negative control (Windows PowerShell)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/mod
        run: |
          $script = "$env:GITHUB_WORKSPACE\tools\test-runners\run-tests.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File $script MyMod.Tests\MyMod.Tests.csproj
          if ($LASTEXITCODE -ne 1) { Write-Output "::error::a net48-only failure must make run-tests.ps1 exit 1; it exited $LASTEXITCODE"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script --framework net10.0 MyMod.Tests\MyMod.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A filter that selects no test must not pass the net48 leg.
          powershell -NoProfile -ExecutionPolicy Bypass -File $script --framework net48 --filter FullyQualifiedName~NoSuchTest MyMod.Tests\MyMod.Tests.csproj
          if ($LASTEXITCODE -ne 1) { Write-Output "::error::a net48 leg that ran no tests must make run-tests.ps1 exit 1; it exited $LASTEXITCODE"; exit 1 }
          exit 0
