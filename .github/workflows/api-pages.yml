name: Documentation site

# The existing test workflow builds the site on PRs. Only main publishes it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-pages.yml'
      - '.config/dotnet-tools.json'
      - 'cli-dependency.json'
      - 'docs/**'
      - '!docs/maintainers/**'
      - 'llms.txt'
      - 'toolkit-versions.json'
      - 'scripts/api-docs.cs'
      - 'scripts/versioned-api-docs.cs'
      - 'scripts/bootstrap-cli.cs'
      - 'scripts/validate.cs'
      - 'scripts/Shared/**'
      - 'scripts/Directory.Build.props'
      - 'src/**'
      - 'tests/Valheim.Testing.Adapter.CompileCheck/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: api-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main # Branch dispatches intentionally rebuild main; previews do not deploy to Pages.
      - uses: ./.github/actions/setup
        with:
          pinned-downloads: true
      - name: Build the pinned CLI transport package
        uses: ./.github/actions/setup
        with:
          phase: bootstrap
          evidence-label: api-pages
      # The whole serial validation on one runner: a test command ends at its 10-minute hard limit (#719), then packaging.
      - run: dotnet run scripts/validate.cs
        timeout-minutes: 20
      - run: dotnet tool restore
      - run: dotnet run scripts/api-docs.cs
      - name: Add published 0.1 reference snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run scripts/versioned-api-docs.cs -- assemble docs/reference/_site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/reference/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
