name: Tests
# Runs the mod's tests on every push and pull request. Builds only the test project: the plugin project
# references Valheim, Unity and BepInEx assemblies that a hosted runner does not have, and those must not
# be committed or uploaded. Uses no game, Steam account or secret.
# Pushes to main and pull requests only: a branch with an open PR would otherwise run twice.
# Change main if your default branch has another name.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Change the path to your test project.
      - run: dotnet test MyMod.Tests/MyMod.Tests.csproj -c Release
