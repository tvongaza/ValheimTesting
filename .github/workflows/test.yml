name: Local test layers
# Bootstrap and local validation on every supported toolkit OS: library tests, example builds, the
# no-game example, package-consuming mod tests and packing. Never launches Valheim or a server. The scripts are .NET file-based
# programs, so the same commands run in each runner's default shell. No secrets are used. The mod-example job runs
# the ModWithTests workflow template's commands against the published packages. The game-hosts job drives the real ssh
# and docker paths of the game hosts against a throwaway sshd on localhost and a throwaway container.
# Pushes to main and pull requests only: a branch with an open PR would otherwise run everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # One OS failing must not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the public-api check reads the pull request's current description
    env:
      # GitHub's Windows runners run the job in the signed-in console session, so the interactive client's scheduled-task
      # start is required to run there (with stand-ins for Steam and the game) rather than only its refusal.
      VALHEIM_TESTING_WINDOWS_DESKTOP: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      # The NuGet package cache's paths (see "Restore the NuGet package cache"), shared by its restore and save.
      VT_NUGET_CACHE_PATHS: |
        ~/.nuget/packages
        !~/.nuget/packages/valheim.testing*
        !~/.nuget/packages/valheim.cli*
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # a pull request's merge commit and its base (HEAD^1), for the public-api check
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Packages from NuGet.org, reused across runs. Never this repository's own packages (Valheim.Testing*, and the CLI
      # transport bootstrap builds): validate packs those at versions it reuses and checks that consumers restore exactly what
      # it packed, which a cached copy of an earlier build would defeat. A restored entry is trusted as NuGet's global
      # packages folder trusts its own files; only this repository's workflows can write the cache, a pull request only for itself.
      - name: Restore the NuGet package cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VT_NUGET_CACHE_PATHS }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'scripts/*.cs', 'cli-dependency.json', 'NuGet.Config', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet --info
      - name: Seed an obsolete CLI package for the local-feed cleanup regression
        if: runner.os == 'Linux'
        run: |
          mkdir -p .packages
          printf 'obsolete CLI package' > .packages/Valheim.Testing.Cli.0.1.0-preview.0.nupkg
      - run: dotnet run scripts/bootstrap-cli.cs
      - name: Confirm the obsolete CLI package was removed
        if: runner.os == 'Linux'
        run: test ! -e .packages/Valheim.Testing.Cli.0.1.0-preview.0.nupkg
      - name: Seed stale publish files for the packaging regression
        run: dotnet run scripts/tool-pack.cs -- seed
      # Normal runs take 3-6 minutes; the step timeout bounds a stuck one. The transcript and test results are kept when the
      # step fails or is cancelled (#171), and a test run with no progress for five minutes names its unfinished tests.
      - run: dotnet run scripts/validate.cs
        timeout-minutes: 20
      - name: Keep the validation transcript
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: validate-${{ matrix.os }}
          path: artifacts/validate
          if-no-files-found: ignore
          retention-days: 14
      # Runs the file-based scripts no other PR step runs, as a user runs them (#434: file-based apps default to PublishAot,
      # which turns off reflection-based System.Text.Json unless the script sets PublishAot=false). The two dependency scripts
      # read and write their JSON; the other two only start. Judged by exit codes, on Linux only: an SDK
      # default reaches every OS alike. api-docs, pins, bootstrap-cli and validate run in this workflow, consumer in release.yml;
      # tools/doubles-members needs the game's assemblies.
      - name: File-based scripts run
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          t=$(mktemp -d)
          root=$(jq -r .root loader-dependency.json)
          unzip -q .packages/bepinexpack-valheim.zip -d "$t/pack" && mv "$t/pack/$root" "$t/loader"
          unzip -q .packages/valheimcli-bundle.zip -d "$t/cli"
          dotnet run scripts/bepinex-loader.cs -- capture "$t/loader" "$root" "$(jq -r .version loader-dependency.json)" "$t/loader.json"
          dotnet run scripts/bepinex-loader.cs -- check "$t/loader.json"
          # A real plugin from the pinned bundle. With no game assemblies here its references are confirmed optional, so the lock
          # is ready. A bundle pin that adds a reference fails resolve with a gap line naming it: add that name to the list.
          mkdir "$t/managed"
          cat > "$t/request.json" <<'EOF'
          {"mods": ["cli/Valheim.Cli.WorldTools.dll"], "searchRoots": [], "gameManaged": "managed",
           "bepInExCore": "loader/BepInEx/core", "cliManifest": "cli/cli-manifest.json", "cliFiles": "cli",
           "capabilities": [], "optionalReferences": ["System", "System.Core", "mscorlib", "UnityEngine.CoreModule",
           "UnityEngine.PhysicsModule", "assembly_utils", "assembly_valheim"]}
          EOF
          dotnet run scripts/native-dependencies.cs -- resolve "$t/request.json" "$t/lock.json"
          dotnet run scripts/native-dependencies.cs -- check "$t/lock.json"
          dotnet run scripts/pwsh-startup-stress.cs -- --starts 8 --parallel 4 --guard
          code=0; dotnet run --file tools/dev-loop/dev-loop.cs || code=$?
          if [ "$code" != 4 ]; then echo "::error::dev-loop.cs with no arguments exited $code, not 4 (usage)"; exit 1; fi
      - name: Build candidate API reference
        if: runner.os == 'Linux'
        run: |
          dotnet tool restore
          dotnet run scripts/api-docs.cs
          dotnet run scripts/versioned-api-docs.cs -- archive docs/reference/_site 0.1.0-rc.1 "$GITHUB_SHA" "$RUNNER_TEMP/api-reference-0.1.0-rc.1.tgz"
          sha=$(sha256sum "$RUNNER_TEMP/api-reference-0.1.0-rc.1.tgz" | cut -d ' ' -f 1)
          dotnet run scripts/versioned-api-docs.cs -- install "$RUNNER_TEMP/api-reference-0.1.0-rc.1.tgz" "$sha" 0.1.0-rc.1 "$RUNNER_TEMP/api-site"
          # Prove the selected-entrypoint gate refuses a missing rendered summary.
          page=docs/reference/api/Valheim.Testing.ITerrain.yml
          cp "$page" "$RUNNER_TEMP/ITerrain.yml"
          sed -i '0,/^  summary:/s/^  summary:/  omitted-summary:/' "$page"
          if out=$(dotnet run scripts/api-docs.cs -- check-docs 2>&1); then
            echo "$out"; echo "::error::An undocumented entrypoint passed the documentation gate."; exit 1
          fi
          case "$out" in *'has no XML summary: Valheim.Testing.ITerrain'*) ;; *) echo "$out"; exit 1 ;; esac
          cp "$RUNNER_TEMP/ITerrain.yml" "$page"
          dotnet run scripts/api-docs.cs -- check-docs
      # The committed public-api lists match the builds; a pull request that changes them says why on a line starting
      # "public-api:" in its description, read here rather than from the event, so editing it and re-running the job is enough.
      - name: Public API lists
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            body=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body) || { echo "::error::could not read PR #$PR_NUMBER's description"; exit 1; }
            PR_BODY=$body dotnet run scripts/api-docs.cs -- check --base HEAD^1
          else
            dotnet run scripts/api-docs.cs -- check
          fi
          # Negative controls, each restored after. GITHUB_ACTIONS is unset so the expected failures are not annotations.
          refused() { # $1 a pattern the refusal must match; the rest, the check's arguments
            pattern=$1; shift
            if out=$(env -u GITHUB_ACTIONS dotnet run scripts/api-docs.cs -- check "$@" 2>&1); then
              echo "$out"; echo "::error::api-docs check $* passed; expected a refusal matching: $pattern"; return 1
            fi
            echo "$out"
            case "$out" in *"$pattern"*) ;; *) echo "::error::api-docs check $* refused, but not with: $pattern"; return 1 ;; esac
          }
          # A list out of step with the build (one type line removed) is refused, naming the line.
          list=docs/reference/public-api/Valheim.Testing.txt
          removed=$(sed -n '2p' "$list")
          sed -i '2d' "$list"
          refused "  +$removed" || exit 1
          git checkout -- "$list"
          # A change to the lists since a base (the empty tree: every list is new) needs the description line, and passes with it.
          empty=$(git hash-object -t tree /dev/null)
          PR_BODY='' refused 'no line starting "public-api:"' --base "$empty" || exit 1
          PR_BODY='public-api: negative control' dotnet run scripts/api-docs.cs -- check --base "$empty"
          # A public record an operation returns, without [ResultShape], is refused by name (#292); the rebuild after restores.
          printf 'namespace Valheim.Testing.Game;\npublic sealed record ScratchResult(int Value);\npublic static class ScratchOperation { public static ScratchResult Read() => new(1); }\n' > src/Valheim.Testing.Game/ScratchResult.cs
          dotnet build -c Release src/Valheim.Testing.Game --no-restore -v q
          refused 'ScratchResult is part of a result' || exit 1
          rm src/Valheim.Testing.Game/ScratchResult.cs
          dotnet build -c Release src/Valheim.Testing.Game --no-restore -v q
          dotnet run scripts/api-docs.cs -- check
          git diff --exit-code
      - name: Save the NuGet package cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VT_NUGET_CACHE_PATHS }}
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
  mod-example:
    name: mod example (published packages)
    # Keep in step with examples/ModWithTests/.github/workflows/tests.yml. A copy outside the checkout leaves this
    # repository's NuGet.Config and local feed out of play, so packages restore from NuGet.org only, as in a mod.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp -R examples/ModWithTests "$RUNNER_TEMP/mod"
      - run: dotnet test MyMod.Tests/MyMod.Tests.csproj -c Release
        working-directory: ${{ runner.temp }}/mod
  pins:
    name: pins (toolkit-versions.json)
    # toolkit-versions.json records the released versions; docs, examples and tools pin exactly those and follow every release
    # (#86). Fails on a pin that differs from the file, a recorded version NuGet.org does not serve or has superseded, a
    # released package whose Valheim.Testing* dependency the released set does not meet, or a source version older than
    # its release, or a valheimCLI fork page the docs link that does not exist at releasedCliCommit. Reads NuGet.org and
    # GitHub; needs no build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versions compares src/Valheim.Testing.Game with the commit its published version was built from
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: dotnet run scripts/pins.cs -- check
      # Negative controls. Each edits tracked files, expects a refusal that names the file (and line), and restores them.
      # GITHUB_ACTIONS is unset so the expected failures do not become annotations on the run.
      - name: Refusals (negative controls)
        run: |
          refused() { # $1 mode, $2 a pattern the refusal must match
            if out=$(env -u GITHUB_ACTIONS dotnet run scripts/pins.cs -- "$1" 2>&1); then
              echo "$out"; echo "::error::pins $1 passed; expected a refusal matching: $2"; return 1
            fi
            echo "$out"
            case "$out" in *$2*) ;; *) echo "::error::pins $1 refused, but not with: $2"; return 1 ;; esac
            git checkout -- .
          }
          # A pin changed by hand, without the file, fails with its file and line; write puts it back.
          doubles=examples/ModWithTests/MyMod.Tests/MyMod.Tests.csproj
          sed -i -E 's/(Include="Valheim\.Testing\.Doubles" Version="\[)[^]]+\]/\10.1.0-preview.5]/' "$doubles"
          line=$(grep -n 'Include="Valheim.Testing.Doubles"' "$doubles" | cut -d: -f1)
          refused check "FAIL $doubles:$line: Valheim.Testing.Doubles 0.1.0-preview.5 differs from toolkit-versions.json"
          sed -i -E 's/(Include="Valheim\.Testing\.Doubles" Version="\[)[^]]+\]/\10.1.0-preview.5]/' "$doubles"
          dotnet run scripts/pins.cs -- write
          git diff --exit-code
          # Docs that lag a release: the file (and every pin written from it) names an older Game than NuGet.org serves.
          sed -i -E 's/("Valheim\.Testing\.Game": ")[^"]+"/\10.1.0-preview.17"/' toolkit-versions.json
          dotnet run scripts/pins.cs -- write
          refused check "Valheim.Testing.Game 0.1.0-preview.17 is superseded"
          # The pairing (#336): a released Valheim.Testing older than the released Doubles depends on.
          sed -i -E 's/("Valheim\.Testing": ")[^"]+"/\10.1.0-preview.6"/' toolkit-versions.json
          dotnet run scripts/pins.cs -- write
          refused check "depends on Valheim.Testing [0-9]*, but the released Valheim.Testing is 0.1.0-preview.6: a page pinning both"
          # Candidates may sit on main between releases; release.yml refuses them.
          sed -i -E 's/("packageVersion": "[^"]+)"/\1-candidate.0000000"/' cli-dependency.json
          refused versions "cli-dependency.json:[0-9]*: names the candidate version"
          sed -i -E 's/(Include="Valheim\.Testing\.Cli" Version="\[[^]]+)\]/\1-candidate.0000000]/' src/Valheim.Testing.Game/Valheim.Testing.Game.csproj
          refused versions "src/Valheim.Testing.Game/Valheim.Testing.Game.csproj:[0-9]*: names the candidate version"
          # A fork move cannot silently reuse the transport's published version: the package on NuGet.org keeps its old bytes.
          sed -i -E 's/("packageVersion": ")[^"]+"/\10.1.0-preview.8"/' cli-dependency.json
          refused versions "Valheim.Testing.Cli 0.1.0-preview.8 is already on NuGet.org from fork commit"
          # A source version older than its release.
          sed -i -E 's#<Version>[^<]+</Version>#<Version>0.1.0-preview.1</Version>#' src/Valheim.Testing.Doubles/Valheim.Testing.Doubles.csproj
          refused versions "Valheim.Testing.Doubles 0.1.0-preview.1 in source is older than the release"
          # A change under a version NuGet.org already serves, in a package the valheim-test tool embeds (#363): with Game and
          # the project it references exactly as the released Game was built (its nuspec's commit), versions reports nothing
          # about Game; one changed line in either is refused, naming the file.
          game=src/Valheim.Testing.Game
          embedded=("$game" src/Valheim.Testing)
          released=$(sed -nE 's/.*"Valheim\.Testing\.Game": "([^"]+)".*/\1/p' toolkit-versions.json)
          commit=$(curl -fsS "https://api.nuget.org/v3-flatcontainer/valheim.testing.game/$released/valheim.testing.game.nuspec" | sed -nE 's/.*<repository [^>]*commit="([0-9a-f]{40})".*/\1/p')
          git checkout --no-overlay "$commit" -- "${embedded[@]}"
          out=$(env -u GITHUB_ACTIONS dotnet run scripts/pins.cs -- versions 2>&1) || true
          echo "$out"
          case "$out" in *"problem(s)."*|*"No candidate version"*) ;; *) echo "::error::pins versions did not finish"; exit 1 ;; esac
          case "$out" in *"$game/Valheim.Testing.Game.csproj"*) echo "::error::versions refused the released Game source"; exit 1 ;; esac
          echo '// changed' >> "$game/ZonePreparation.cs"
          refused versions "Valheim.Testing.Game $released is on NuGet.org, and its source changed since it was built (*): $game/ZonePreparation.cs."
          echo '// changed' >> src/Valheim.Testing/Terrain.cs
          refused versions "Valheim.Testing.Game $released is on NuGet.org, and its source changed since it was built (*): src/Valheim.Testing/Terrain.cs."
          git checkout --no-overlay HEAD -- "${embedded[@]}"
          git diff --exit-code HEAD
          # A valheimCLI fork link at another commit than the released Cli's fails; write puts it back. A fork page's
          # anchor must be one of its headings at that commit.
          loop=tools/dev-loop/README.md
          sed -i -E 's#(valheimCLI/blob/[0-9a-f]{40}/docs/expectations\.md\#)world-files-hash#\1no-such-heading#' "$loop"
          refused check "FAIL $loop:$(grep -n 'no-such-heading' "$loop" | cut -d: -f1): https://github.com/tvongaza/valheimCLI/blob/*/docs/expectations.md#no-such-heading: the fork's docs/expectations.md at * has no heading with the anchor #no-such-heading"
          fork() { sed -i -E 's#(valheimCLI/blob/)[0-9a-f]{40}/#\15c0aef02ddf15cdbf6faa152c6b75881fce7f134/#' tools/dev-loop/README.md; }
          fork
          refused check "FAIL $loop:$(grep -n 'valheimCLI/blob/5c0aef02' "$loop" | cut -d: -f1): releasedCliCommit 5c0aef02ddf15cdbf6faa152c6b75881fce7f134 differs from toolkit-versions.json"
          fork
          dotnet run scripts/pins.cs -- write
          git diff --exit-code
  docs:
    name: docs (headings and links)
    # The Markdown pages (#278): no heading names a version or a date (native-validation records are exempt), no link goes
    # to a review branch or to a valheimCLI fork page at anything but a full commit, and every relative link, and every link
    # to this repository's main branch, reaches an existing file and heading anchor. Offline, so it is not hidden while the
    # pins job waits for a release record.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: dotnet run scripts/pins.cs -- docs
      # Negative controls: each edits tracked files, expects a refusal naming the file (and line), and restores them.
      - name: Refusals (negative controls)
        run: |
          refused() { # $1 a pattern the refusal must match
            if out=$(env -u GITHUB_ACTIONS dotnet run scripts/pins.cs -- docs 2>&1); then
              echo "$out"; echo "::error::docs passed; expected a refusal matching: $1"; return 1
            fi
            echo "$out"
            case "$out" in *$1*) ;; *) echo "::error::docs refused, but not with: $1"; return 1 ;; esac
            git checkout -- .
          }
          page=docs/packages/Valheim.Testing.Game.md
          sed -i 's/^## Waiting$/## Waiting (preview 13)/' "$page"
          refused "FAIL $page:$(grep -n '^## Waiting' "$page" | cut -d: -f1): A heading names a version or a date"
          last() { echo "FAIL docs/adopting.md:$(wc -l < docs/adopting.md): $1"; }
          echo '[removed](testing-toolkit.md#waiting)' >> docs/adopting.md
          refused "$(last 'testing-toolkit.md#waiting: docs/testing-toolkit.md does not exist')"
          echo '[stale](packages/Valheim.Testing.Game.md#waiting-preview-13)' >> docs/adopting.md
          refused "$(last 'packages/Valheim.Testing.Game.md#waiting-preview-13: docs/packages/Valheim.Testing.Game.md has no heading with the anchor #waiting-preview-13')"
          echo '[moving](https://github.com/tvongaza/valheimCLI/blob/review/x/README.md)' >> docs/adopting.md
          refused "$(last 'https://github.com/tvongaza/valheimCLI/blob/review/x/README.md links a review branch')"
          echo '[short](https://github.com/tvongaza/valheimCLI/tree/main/docs)' >> docs/adopting.md
          refused "$(last 'https://github.com/tvongaza/valheimCLI/tree/main/docs links the valheimCLI fork at a branch or short commit')"
          git diff --exit-code
  game-hosts:
    name: game hosts (ssh to localhost, container)
    # Valheim.Testing.Game's SSH and container hosts end to end, without a game: an sshd on 127.0.0.1:2222 that accepts only
    # a key generated for this run (bash and pwsh sessions, a loopback port forward), and an Ubuntu container on the host
    # network driven with docker exec. An Xvfb display on :99 carries the interactive client checks (a stand-in Steam and
    # game), locally and over the ssh. All are removed at the end; .github/scripts/game-hosts.sh sets up and removes the
    # sshd and the display.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALHEIM_TESTING_REQUIRE_HOSTS: '1'
      VALHEIM_TESTING_SSH_PORT: '2222'
      VALHEIM_TESTING_SSH_SHELLS: bash,pwsh
      VALHEIM_TESTING_CONTAINER: vt-game-host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: dotnet run scripts/bootstrap-cli.cs
      - name: Start a throwaway sshd on 127.0.0.1:2222 and a virtual X display
        run: bash .github/scripts/game-hosts.sh start
      - name: Start a throwaway container on the host network
        run: docker run -d --rm --name vt-game-host --network host ubuntu:24.04 sleep 1800
      - run: dotnet test tests/Valheim.Testing.Tests/Valheim.Testing.Tests.csproj -c Release --filter Category=GameHosts
      - name: Stop the sshd, the display and the container
        if: always()
        run: |
          docker rm -f vt-game-host || true
          bash .github/scripts/game-hosts.sh stop
  test-runners:
    name: test runners (${{ matrix.os }})
    # tools/test-runners for real: a copy of ModWithTests that also targets net48 and imports the targets file (the
    # three changes its README describes), run with Mono on Linux and macOS and on .NET Framework on Windows, with the
    # same command on every OS. Negative control: an added test that fails only on .NET Framework must fail the run,
    # while the net10.0 leg alone still passes, and a filter that selects no test must fail the net48 leg.
    # Packages restore from NuGet.org, as in a mod.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Hosted Linux and macOS images carry no Mono. On Ubuntu, mono-devel is the smallest package set that runs the net48
      # leg: mono-runtime alone lacks the System.Runtime and netstandard facades the console runner loads. Its archives
      # are cached because the mirror's speed, not their size, decides the install time: the same 52 MB took 6 s or
      # several minutes on different runners.
      - name: Key the Mono packages
        if: runner.os == 'Linux'
        id: mono-debs
        run: |
          sudo apt-get update -q
          # Name, size and checksum of each archive apt would fetch: a new package version is a new key, never a stale hit.
          apt-get install --print-uris -qq -y --no-install-recommends mono-devel > "$RUNNER_TEMP/mono-uris.txt"
          echo "key=mono-debs-$ImageOS-${{ runner.arch }}-$(sha256sum < "$RUNNER_TEMP/mono-uris.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the Mono packages
        if: runner.os == 'Linux'
        id: mono-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mono-debs
          key: ${{ steps.mono-debs.outputs.key }}
      - name: Install Mono
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-mono.sh
      - name: Save the Mono packages
        if: runner.os == 'Linux' && steps.mono-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mono-debs
          key: ${{ steps.mono-debs.outputs.key }}
      - name: Install Mono
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install mono
          mono --version
      - name: Copy ModWithTests, target net48 too and import the targets
        run: |
          cp -R examples/ModWithTests "$RUNNER_TEMP/mod"
          cp tools/test-runners/Valheim.TestRunners.targets "$RUNNER_TEMP/mod/"
          project="$RUNNER_TEMP/mod/MyMod.Tests/MyMod.Tests.csproj"
          sed -i.orig \
            -e 's#<TargetFramework>net10.0</TargetFramework>#<TargetFrameworks>net48;net10.0</TargetFrameworks>#' \
            -e 's#<PackageReference Include="xunit" Version="2.8.1" />#&<PackageReference Include="xunit.runner.console" Version="2.8.1" PrivateAssets="all" />#' \
            -e 's#</Project>#  <Import Project="../Valheim.TestRunners.targets" />\n</Project>#' \
            "$project"
          grep -q '<TargetFrameworks>net48;net10.0</TargetFrameworks>' "$project"
          grep -q 'Include="xunit.runner.console"' "$project"
          grep -q 'Valheim.TestRunners.targets' "$project"
          rm "$project.orig"
      - name: Both frameworks pass
        working-directory: ${{ runner.temp }}/mod
        run: dotnet build MyMod.Tests/MyMod.Tests.csproj -t:RunTestsOnBothFrameworks
      - name: Add a test that fails only on .NET Framework
        run: |
          cat > "$RUNNER_TEMP/mod/MyMod.Tests/Net48OnlyFailure.cs" <<'CS'
          using Xunit;

          public class Net48OnlyFailure
          {
              [Fact]
              public void FailsOnlyOnNetFramework()
              {
          #if NETFRAMEWORK
                  Assert.Fail("negative control: this test fails only on .NET Framework");
          #endif
              }
          }
          CS
      - name: Negative control
        working-directory: ${{ runner.temp }}/mod
        run: |
          run() { dotnet build MyMod.Tests/MyMod.Tests.csproj -t:RunTestsOnBothFrameworks "$@" | tee "$RUNNER_TEMP/run.log"; return "${PIPESTATUS[0]}"; }
          status=0; run || status=$?
          if [ "$status" = 0 ] || ! grep -q 'net48: FAILED (tests, exit 1)' "$RUNNER_TEMP/run.log"; then echo "::error::a net48-only failure must fail the run; it exited $status"; exit 1; fi
          run -f net10.0
          # A filter that selects no test must not pass the net48 leg.
          status=0; run -f net48 -p:VSTestTestCaseFilter=FullyQualifiedName~NoSuchTest || status=$?
          if [ "$status" = 0 ] || ! grep -q 'net48: FAILED (no tests ran)' "$RUNNER_TEMP/run.log"; then echo "::error::a net48 leg that ran no tests must fail the run; it exited $status"; exit 1; fi
